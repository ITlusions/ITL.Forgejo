# Values for the itl-forgejo wrapper chart.
# Everything here nests under `forgejo:` because forgejo/forgejo is a
# dependency (sub-chart) of this chart — see Chart.yaml.
#
# Upstream reference values (all settings):
# https://code.forgejo.org/forgejo-helm/forgejo-helm/raw/tag/v17.1.5/values.yaml
#
# Unlike the gitlab/gitlab chart, this one does NOT hard-require external
# Postgres/Redis — it falls back to SQLite + in-memory cache/session/queue
# if unset. That's fine for a quick try-out, but upstream explicitly calls
# it "not recommended for production use". We wire Postgres to an external
# CNPG cluster (same pattern as ITL.Gitlab) but use an in-cluster Redis —
# see `redis:` below and templates/redis.yaml. Forgejo's redis load is
# light (cache/session/queue for a single instance), so a single-replica
# in-cluster Redis is plenty; no need for a managed/external one here.

# In-cluster Redis for Forgejo's cache/session/queue — plain
# Deployment+PVC+Service (templates/redis.yaml), not a chart dependency
# (avoids the Bitnami images-behind-a-subscription issue). Single replica,
# no HA — fine for this workload. Disable and point forgejo.gitea.config.*
# at a real external Redis instead if you'd rather not run this in-chart.
redis:
  enabled: true
  image:
    repository: redis
    tag: "7-alpine"
  persistence:
    size: 1Gi
    storageClass: ""
  resources: {}

# In-cluster CNPG Postgres cluster (templates/cnpg-cluster.yaml), requires
# the CNPG operator already installed cluster-wide (see itl.cnpg/operator).
# No ingress/IngressRouteTCP - in-cluster only by design, reachable only
# via the ClusterIP service CNPG generates (<release>-db-rw).
# CNPG auto-creates the app user/database and a Secret named
# "<release>-db-app" (keys: username, password, dbname, host, port,
# uri, jdbc-uri) - no manual secret to create, unlike the old
# "forgejo-postgresql-password" placeholder this replaces.
postgresql:
  enabled: true
  instances: 2
  database: forgejo
  owner: forgejo
  storage:
    size: 5Gi
    storageClass: "ha-dbs-lh"

# Auto-generates the forgejo-admin-secret Secret (templates/admin-secret.yaml)
# on first install instead of requiring a manual `kubectl create secret`
# step - password is random, generated once, then kept stable across
# upgrades. Set create: false and manage gitea.admin.existingSecret
# yourself if you'd rather provide a specific password.
adminSecret:
  create: true
  username: admin
  email: admin@itlusions.com

forgejo:
  ingress:
    enabled: true
    className: traefik
    annotations:
      cert-manager.io/cluster-issuer: "letsencrypt-issuer"
      traefik.ingress.kubernetes.io/router.entrypoints: web, websecure
    hosts:
      - host: forgejo.dev.itlusions.com
        paths:
          - path: /
            pathType: Prefix
            port: http
    tls:
      - secretName: forgejo-dev-itlusions-com-tls
        hosts:
          - forgejo.dev.itlusions.com

  gitea:
    admin:
      # TODO: create this secret first (keys: username, password, email) —
      # do not put real credentials in this file.
      #   kubectl create secret generic forgejo-admin-secret -n forgejo \
      #     --from-literal=username=admin \
      #     --from-literal=password='...' \
      #     --from-literal=email=admin@itlusions.com
      existingSecret: forgejo-admin-secret

    config:
      server:
        DOMAIN: forgejo.dev.itlusions.com
        ROOT_URL: "https://forgejo.dev.itlusions.com"
        SSH_DOMAIN: forgejo.dev.itlusions.com

      # ----------------------------------------------------------------
      # In-cluster CNPG Postgres (see `postgresql:` above /
      # templates/cnpg-cluster.yaml). HOST is CNPG's deterministic
      # read-write service name, <release>-db-rw — assumes this chart is
      # installed as `forgejo` in the `forgejo` namespace, per this
      # repo's README install command; adjust if installed differently.
      # ----------------------------------------------------------------
      database:
        DB_TYPE: postgres
        HOST: "forgejo-db-rw.forgejo.svc.cluster.local:5432"
        NAME: forgejo
        USER: forgejo
        SSL_MODE: disable
        # PASSWD is intentionally not set here — see
        # gitea.additionalConfigFromEnvs below, which injects it from
        # CNPG's auto-generated app Secret instead of plaintext in values.

      # ----------------------------------------------------------------
      # In-cluster Redis (see `redis:` above / templates/redis.yaml) for
      # cache/session/queue, instead of the in-memory defaults. Hostname
      # assumes the release is installed as `forgejo` in the `forgejo`
      # namespace, per this repo's README install command — adjust if
      # you install it differently.
      # ----------------------------------------------------------------
      cache:
        ADAPTER: redis
        HOST: "redis://forgejo-redis.forgejo.svc.cluster.local:6379/0"
      session:
        PROVIDER: redis
        PROVIDER_CONFIG: "redis://forgejo-redis.forgejo.svc.cluster.local:6379/1"
      queue:
        TYPE: redis
        CONN_STR: "redis://forgejo-redis.forgejo.svc.cluster.local:6379/2"

    # Injects the DB password from CNPG's auto-generated app Secret as a
    # GITEA__DATABASE__PASSWD env var, instead of embedding plaintext in
    # this values file or hand-creating a Secret — CNPG creates
    # "<release>-db-app" itself from templates/cnpg-cluster.yaml's
    # bootstrap.initdb. (The in-cluster Redis above has no auth, so
    # nothing needed for it.)
    additionalConfigFromEnvs:
      - name: GITEA__DATABASE__PASSWD
        valueFrom:
          secretKeyRef:
            name: forgejo-db-app
            key: password

  persistence:
    enabled: true
    size: 10Gi
    # TODO: confirm this matches an actual StorageClass in the cluster
    storageClass: ""
