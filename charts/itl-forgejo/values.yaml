# Values for the itl-forgejo wrapper chart.
# Everything here nests under `forgejo:` because forgejo/forgejo is a
# dependency (sub-chart) of this chart — see Chart.yaml.
#
# Upstream reference values (all settings):
# https://code.forgejo.org/forgejo-helm/forgejo-helm/raw/tag/v17.1.5/values.yaml
#
# Unlike the gitlab/gitlab chart, this one does NOT hard-require external
# Postgres/Redis — it falls back to SQLite + in-memory cache/session/queue
# if unset. That's fine for a quick try-out, but upstream explicitly calls
# it "not recommended for production use". We wire Postgres to an external
# CNPG cluster (same pattern as ITL.Gitlab) but use an in-cluster Redis —
# see `redis:` below and templates/redis.yaml. Forgejo's redis load is
# light (cache/session/queue for a single instance), so a single-replica
# in-cluster Redis is plenty; no need for a managed/external one here.

# In-cluster Redis for Forgejo's cache/session/queue — plain
# Deployment+PVC+Service (templates/redis.yaml), not a chart dependency
# (avoids the Bitnami images-behind-a-subscription issue). Single replica,
# no HA — fine for this workload. Disable and point forgejo.gitea.config.*
# at a real external Redis instead if you'd rather not run this in-chart.
redis:
  enabled: true
  image:
    repository: redis
    tag: "7-alpine"
  persistence:
    size: 1Gi
    storageClass: ""
  resources: {}

# In-cluster CNPG Postgres cluster (templates/cnpg-cluster.yaml), requires
# the CNPG operator already installed cluster-wide (see itl.cnpg/operator).
# No ingress/IngressRouteTCP - in-cluster only by design, reachable only
# via the ClusterIP service CNPG generates (<release>-db-rw).
# CNPG auto-creates the app user/database and a Secret named
# "<release>-db-app" (keys: username, password, dbname, host, port,
# uri, jdbc-uri) - no manual secret to create, unlike the old
# "forgejo-postgresql-password" placeholder this replaces.
postgresql:
  enabled: true
  instances: 2
  database: forgejo
  owner: forgejo
  storage:
    size: 5Gi
    storageClass: "ha-dbs-lh"

# Auto-generates the forgejo-admin-secret Secret (templates/admin-secret.yaml)
# on first install instead of requiring a manual `kubectl create secret`
# step - password is random, generated once, then kept stable across
# upgrades. Set create: false and manage gitea.admin.existingSecret
# yourself if you'd rather provide a specific password.
adminSecret:
  create: true
  # Empty = auto-generate a fantasy adjective-animal username
  # (admin-rubberduck style) on first install - see
  # templates/admin-secret.yaml. Set a value here to use a fixed one
  # instead. Either way, NOT "admin" - that's a reserved Gitea/Forgejo
  # username (collides with the /admin dashboard route), confirmed live:
  # "CreateUser: name is reserved [name: admin]".
  username: ""
  email: admin@itlusions.com

# OIDC login via the shared Keycloak (itl-keycloak), same instance
# Headscale/Headplane/the website use. templates/keycloakoidcclient.yaml
# creates the client, templates/oidc-secret.yaml generates its secret
# once (stable across upgrades, same lookup idiom as adminSecret above)
# and mirrors it into BOTH namespaces that need it: itl-keycloak (so the
# Keycloak Operator uses it as the client's actual secret - it reads an
# existing secretRef rather than overwriting it) and forgejo (so Gitea's
# own oauth.existingSecret below can read it). This avoids the
# chicken-and-egg problem of the Operator creating its own secret
# asynchronously after this Helm install already finished - we decide
# the value synchronously instead, and the Operator just adopts it.
oidc:
  enabled: true
  clientId: forgejo
  # The provider "name" Gitea uses in its callback path
  # (/user/oauth2/<name>/callback) - kept lowercase, separate from
  # clientId in case they ever need to differ.
  providerName: keycloak
  keycloakCRName: itl-keycloak
  keycloakNamespace: itl-keycloak
  realm: itlusions
  issuer: "https://sts.itlusions.com/realms/itlusions"
  displayName: "Forgejo"
  redirectUris:
    - "https://git.itlusions.com/user/oauth2/keycloak/callback"
  webOrigins:
    - "https://git.itlusions.com"

forgejo:
  ingress:
    enabled: true
    # NOT "traefik" - the actual IngressClass in this cluster is named
    # itl-traefik (confirmed via `kubectl get ingressclass`; every other
    # working ingress - Headscale, Keycloak, the website - uses it too).
    # A plain "traefik" matches no IngressClass, so Traefik never claims
    # this Ingress and falls back to serving its self-signed default
    # cert - that was the SSL error.
    className: itl-traefik
    annotations:
      cert-manager.io/cluster-issuer: "letsencrypt-issuer"
      traefik.ingress.kubernetes.io/router.entrypoints: web, websecure
    hosts:
      - host: git.itlusions.com
        paths:
          - path: /
            pathType: Prefix
            port: http
      - host: git.dev.itlusions.com
        paths:
          - path: /
            pathType: Prefix
            port: http
    tls:
      - secretName: git-itlusions-com-tls
        hosts:
          - git.itlusions.com
      - secretName: git-dev-itlusions-com-tls
        hosts:
          - git.dev.itlusions.com

  gitea:
    admin:
      existingSecret: forgejo-admin-secret

    # Declarative OIDC login via Keycloak - see `oidc:` above /
    # templates/keycloakoidcclient.yaml + templates/oidc-secret.yaml for
    # where forgejo-oauth-secret (key/secret) comes from.
    oauth:
      - name: keycloak
        provider: openidConnect
        existingSecret: forgejo-oauth-secret
        autoDiscoverUrl: "https://sts.itlusions.com/realms/itlusions/.well-known/openid-configuration"

    config:
      # ----------------------------------------------------------------
      # Local self-registration (plain username/password, no Keycloak
      # involved) defaults to OPEN in Forgejo - confirmed via the config
      # cheat sheet, DISABLE_REGISTRATION defaults to false. Anyone could
      # otherwise visit the site and click "Register" to create their
      # own account, completely bypassing the Keycloak OIDC login above.
      # SHOW_REGISTRATION_BUTTON isn't set separately - it defaults to
      # the inverse of DISABLE_REGISTRATION, so the button disappears on
      # its own.
      # ----------------------------------------------------------------
      service:
        DISABLE_REGISTRATION: true

      server:
        # git.itlusions.com is the primary/canonical host (repo clone
        # URLs, SSH) - git.dev.itlusions.com above is just a second
        # ingress host routing to the same instance.
        DOMAIN: git.itlusions.com
        ROOT_URL: "https://git.itlusions.com"
        SSH_DOMAIN: git.itlusions.com

      # ----------------------------------------------------------------
      # Anyone with a valid Keycloak account can auto-provision a
      # Forgejo account on first SSO login - Keycloak is the actual
      # gate (it decides who's a known user), not Forgejo itself.
      # What must stay closed is anonymous local registration with no
      # identity check at all - that's service.DISABLE_REGISTRATION
      # above, not this setting.
      # ----------------------------------------------------------------
      oauth2_client:
        ENABLE_AUTO_REGISTRATION: true

      # ----------------------------------------------------------------
      # In-cluster CNPG Postgres (see `postgresql:` above /
      # templates/cnpg-cluster.yaml). HOST is CNPG's deterministic
      # read-write service name, <release>-db-rw — assumes this chart is
      # installed as `forgejo` in the `forgejo` namespace, per this
      # repo's README install command; adjust if installed differently.
      # ----------------------------------------------------------------
      database:
        DB_TYPE: postgres
        HOST: "forgejo-db-rw.forgejo.svc.cluster.local:5432"
        NAME: forgejo
        USER: forgejo
        SSL_MODE: disable
        # PASSWD is intentionally not set here — see
        # gitea.additionalConfigFromEnvs below, which injects it from
        # CNPG's auto-generated app Secret instead of plaintext in values.

      # ----------------------------------------------------------------
      # In-cluster Redis (see `redis:` above / templates/redis.yaml) for
      # cache/session/queue, instead of the in-memory defaults. Hostname
      # assumes the release is installed as `forgejo` in the `forgejo`
      # namespace, per this repo's README install command — adjust if
      # you install it differently.
      # ----------------------------------------------------------------
      cache:
        ADAPTER: redis
        HOST: "redis://forgejo-redis.forgejo.svc.cluster.local:6379/0"
      session:
        PROVIDER: redis
        PROVIDER_CONFIG: "redis://forgejo-redis.forgejo.svc.cluster.local:6379/1"
      queue:
        TYPE: redis
        CONN_STR: "redis://forgejo-redis.forgejo.svc.cluster.local:6379/2"

    # Injects the DB password from CNPG's auto-generated app Secret as a
    # GITEA__DATABASE__PASSWD env var, instead of embedding plaintext in
    # this values file or hand-creating a Secret — CNPG creates
    # "<release>-db-app" itself from templates/cnpg-cluster.yaml's
    # bootstrap.initdb. (The in-cluster Redis above has no auth, so
    # nothing needed for it.)
    additionalConfigFromEnvs:
      - name: GITEA__DATABASE__PASSWD
        valueFrom:
          secretKeyRef:
            name: forgejo-db-app
            key: password

  persistence:
    enabled: true
    size: 10Gi
    # TODO: confirm this matches an actual StorageClass in the cluster
    storageClass: ""
