{{- if .Values.adminSecret.create }}
{{- $secretName := "forgejo-admin-secret" }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- /*
  Fantasy adjective-animal username (admin-rubberduck style) instead of
  the fixed "admin", which Gitea/Forgejo reserves (collides with the
  /admin dashboard route) - confirmed live: "CreateUser: name is
  reserved [name: admin]". Set adminSecret.username explicitly in values
  to skip the random pick.
*/}}
{{- /* Fixed-size lists (12 entries each, indices 0-11) so randInt's bounds
  can be plain literals - len/sub on a Sprig list returns int64, which
  randInt (expects int) rejects. */}}
{{- $adjectives := list "rubber" "turbo" "sneaky" "grumpy" "wobbly" "spicy" "fuzzy" "quantum" "zesty" "plucky" "nimble" "soggy" }}
{{- $animals := list "duck" "rabbit" "ferret" "walrus" "penguin" "otter" "yeti" "falcon" "badger" "lemur" "platypus" "narwhal" }}
{{- $generatedUsername := printf "admin-%s%s" (index $adjectives (randInt 0 11)) (index $animals (randInt 0 11)) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace }}
type: Opaque
data:
  # Priority: an existing secret's username wins (stability across
  # upgrades, same reasoning as the password below) > an explicit
  # adminSecret.username in values > a freshly generated fantasy name.
  username: {{ if $existing }}{{ index $existing.data "username" }}{{ else if .Values.adminSecret.username }}{{ .Values.adminSecret.username | b64enc }}{{ else }}{{ $generatedUsername | b64enc }}{{ end }}
  email: {{ .Values.adminSecret.email | b64enc }}
  # Generated once on first install, then kept stable across upgrades via
  # `lookup` (re-templating would otherwise mint a new random password on
  # every `helm upgrade`, locking you out). `lookup` only sees real cluster
  # state - it returns empty under `helm template`/--dry-run, so a plain
  # template render always shows a fresh value here; that's expected.
  password: {{ if $existing }}{{ index $existing.data "password" }}{{ else }}{{ randAlphaNum 24 | b64enc }}{{ end }}
{{- end }}
