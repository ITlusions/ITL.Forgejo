{{- if .Values.adminSecret.create }}
{{- $secretName := "forgejo-admin-secret" }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace }}
type: Opaque
data:
  username: {{ .Values.adminSecret.username | b64enc }}
  email: {{ .Values.adminSecret.email | b64enc }}
  # Generated once on first install, then kept stable across upgrades via
  # `lookup` (re-templating would otherwise mint a new random password on
  # every `helm upgrade`, locking you out). `lookup` only sees real cluster
  # state - it returns empty under `helm template`/--dry-run, so a plain
  # template render always shows a fresh value here; that's expected.
  password: {{ if $existing }}{{ index $existing.data "password" }}{{ else }}{{ randAlphaNum 24 | b64enc }}{{ end }}
{{- end }}
