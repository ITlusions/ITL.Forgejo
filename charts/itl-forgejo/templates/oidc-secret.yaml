{{- if .Values.oidc.enabled }}
{{- $existing := lookup "v1" "Secret" .Values.oidc.keycloakNamespace "forgejo-oidc-secret" }}
{{- $clientSecret := "" }}
{{- if $existing }}
{{- $clientSecret = index $existing.data "client-secret" }}
{{- else }}
{{- $clientSecret = randAlphaNum 32 | b64enc }}
{{- end }}
---
# Read by the Keycloak Operator's KeycloakOIDCClient reconciler
# (keycloakoidcclient.yaml) - the Operator treats an already-existing
# secretRef as the client's real secret rather than overwriting it, so
# generating this value here (once, then stable via lookup above)
# avoids waiting on the Operator's own async secret creation.
apiVersion: v1
kind: Secret
metadata:
  name: forgejo-oidc-secret
  namespace: {{ .Values.oidc.keycloakNamespace }}
  labels:
    app.kubernetes.io/name: forgejo
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    # Required for the Operator to adopt a pre-existing secret - without
    # it, reconciliation fails with "Secret .../forgejo-oidc-secret not
    # found with operator.keycloak.org/kind=KeycloakOIDCClient label"
    # even though the secret exists. Confirmed by comparing against the
    # label set on Headscale's own Operator-created secret.
    operator.keycloak.org/kind: KeycloakOIDCClient
type: Opaque
data:
  client-secret: {{ $clientSecret }}
---
# Same value, mirrored into this release's own namespace under the
# key/secret names Gitea's gitea.oauth[].existingSecret expects
# (confirmed against the upstream forgejo-helm chart's
# templates/gitea/deployment.yaml - it reads keys "key" and "secret",
# not "client-secret").
apiVersion: v1
kind: Secret
metadata:
  name: forgejo-oauth-secret
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: forgejo
type: Opaque
data:
  key: {{ .Values.oidc.clientId | b64enc }}
  secret: {{ $clientSecret }}
{{- end }}
