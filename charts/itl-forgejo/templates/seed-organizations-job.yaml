{{- if .Values.organizations }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-seed-orgs
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: forgejo-seed-orgs
    spec:
      restartPolicy: Never
      containers:
        - name: seed-orgs
          image: curlimages/curl:8.10.1
          env:
            - name: ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: forgejo-admin-secret
                  key: username
            - name: ADMIN_PASS
              valueFrom:
                secretKeyRef:
                  name: forgejo-admin-secret
                  key: password
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              BASE="http://{{ .Release.Name }}-http.{{ .Release.Namespace }}.svc.cluster.local:3000"
              echo "waiting for forgejo API..."
              for i in $(seq 1 30); do
                if curl -sf -u "$ADMIN_USER:$ADMIN_PASS" "$BASE/api/v1/user" > /dev/null; then
                  break
                fi
                sleep 5
              done
              {{- range .Values.organizations }}
              echo "ensuring org {{ .name }}"
              code=$(curl -s -o /dev/null -w "%{http_code}" -u "$ADMIN_USER:$ADMIN_PASS" "$BASE/api/v1/orgs/{{ .name }}")
              if [ "$code" = "404" ]; then
                curl -sf -u "$ADMIN_USER:$ADMIN_PASS" -X POST "$BASE/api/v1/orgs" \
                  -H "Content-Type: application/json" \
                  -d '{"username":"{{ .name }}","full_name":"{{ .fullName | default .name }}","visibility":"{{ .visibility | default "private" }}"}'
                echo "  created"
              else
                echo "  already exists (HTTP $code), skipping"
              fi
              {{- end }}
{{- end }}
